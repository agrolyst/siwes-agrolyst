:root{--forest:#123d2b;--green:#216b47;--lime:#d9ea83;--ink:#17241c;--muted:#68756b;--paper:#f6f7f2;--line:#dce4da}
body{font-family:Inter,"Segoe UI",Arial,sans-serif;background:var(--paper);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
.shell{width:min(1180px,calc(100% - 44px));margin:0 auto}
.header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}

.brand{display:flex;align-items:center;gap:12px;min-width:200px}

.brand span:not(.mark){font-weight:900;color:var(--forest);font-size:.92rem;line-height:1.05;letter-spacing:-.035em}

.links{display:flex;align-items:center;gap:20px;font-size:.86rem;font-weight:700;color:#3d4e41}
.links a:hover{color:var(--green)}
.nav>div{display:flex;align-items:center;gap:9px}
.nav>div .btn{padding:10px 14px;font-size:.83rem}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.17em;font-weight:850;color:var(--green);display:flex;align-items:center;gap:10px}
.eyebrow:before{content:"";display:inline-block;width:24px;height:2px;background:currentColor}
h1,h2,h3{line-height:1.12;letter-spacing:-.045em;font-weight:780}
h1{font-size:clamp(2.6rem,5.5vw,5rem)}
h2{font-size:clamp(1.9rem,3.2vw,3rem)}
p{line-height:1.8}
.hero{background:var(--forest);color:white;padding:76px 0 82px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;width:520px;height:520px;right:-210px;top:-230px;border:1px solid #ffffff1c;transform:rotate(38deg)}
.hero:after{content:"";position:absolute;width:380px;height:380px;right:-120px;bottom:-260px;border:1px solid #ffffff1c;transform:rotate(38deg)}
.hero-grid{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1.18fr) minmax(310px,.82fr);align-items:center;gap:54px}
.hero .eyebrow{color:var(--lime);margin-bottom:22px}
.hero h1{color:#fff;margin-bottom:23px;max-width:770px}
.hero h1 em{font-style:normal;color:var(--lime)}
.hero-lede{max-width:640px;color:#dce7dc;font-size:1.08rem;line-height:1.85}
.hero-actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:27px}
.hero-note{display:flex;align-items:flex-start;gap:11px;margin-top:25px;color:#d0dfd2;font-size:.81rem;max-width:580px}
.hero-note svg{flex:0 0 18px;margin-top:3px}
.hero-visual{min-height:410px;position:relative;display:flex;align-items:center;justify-content:center}
.hero-frame{position:relative;background:#fff;width:min(100%,410px);padding:22px;box-shadow:22px 22px 0 #0d2b1d8c}
.logo-stage{background:#fff;min-height:225px;display:grid;place-items:center;padding:24px;border:1px solid #e5e9e2}
.logo-stage img{display:block;max-width:100%;width:310px;height:180px;object-fit:contain}
.hero-card-line{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px 2px 2px;color:var(--forest)}
.hero-card-line strong{font-size:.91rem;display:block}
.hero-card-line small{color:var(--muted);font-size:.75rem}
.hero-card-number{font-weight:900;font-size:2.1rem;color:#dfe8dc}
.float-tag{position:absolute;left:-24px;bottom:37px;background:var(--lime);color:var(--forest);padding:14px 18px;box-shadow:0 12px 30px #001b1026;min-width:205px}
.float-tag strong{display:block;font-size:.84rem}
.float-tag span{font-size:.75rem}
.trust-strip{background:#fff;border-bottom:1px solid var(--line)}
.trust-grid{display:grid;grid-template-columns:repeat(3,1fr)}
.trust-item{padding:21px 24px;display:flex;gap:13px;align-items:center;border-right:1px solid var(--line)}
.trust-item:last-child{border-right:0}
.icon-box{width:42px;height:42px;display:grid;place-items:center;flex-shrink:0;background:#e9f0e5;color:var(--green)}
.icon-box svg{width:21px;height:21px}
.trust-item strong{display:block;font-size:.88rem}
.trust-item span{display:block;font-size:.76rem;color:var(--muted);margin-top:2px}
.section{padding:82px 0}
.head{max-width:720px;margin-bottom:32px}
.head h2{margin-top:14px}
.head p{max-width:620px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.panel{background:#fff;border:1px solid var(--line);padding:28px}
.num{font-size:.72rem;letter-spacing:.14em;color:var(--green);font-weight:900;margin-bottom:22px}

.step-link{font-weight:800;font-size:.83rem;color:var(--green);display:inline-flex;gap:8px;margin-top:8px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.9fr);gap:62px;align-items:start}
.checks{list-style:none;margin:25px 0 0;padding:0;border-top:1px solid #d2ddcf}
.checks li{display:flex;align-items:flex-start;gap:13px;padding:14px 0;border-bottom:1px solid #d2ddcf;font-size:.93rem}
.checks strong{color:var(--ink)}
.check-icon{width:23px;height:23px;display:grid;place-items:center;background:var(--forest);color:#fff;flex:0 0 23px}
.check-icon svg{width:13px;height:13px}
.requirements-card{background:var(--forest);color:#fff;padding:33px;position:relative;overflow:hidden}
.requirements-card:after{content:"";position:absolute;right:-65px;bottom:-95px;width:240px;height:240px;border:1px solid #ffffff20;transform:rotate(35deg)}
.requirements-card .eyebrow{color:var(--lime)}
.requirements-card h3{font-size:1.65rem;margin-top:17px;max-width:370px}
.requirements-card p{color:#d8e5da;line-height:1.8;font-size:.91rem}
.requirement-note{border-top:1px solid #ffffff30;padding-top:18px;margin-top:24px;color:#d3e0d5;font-size:.8rem}
.journey-grid{display:grid;grid-template-columns:.78fr 1.22fr;gap:60px;align-items:start}
.journey-intro{position:sticky;top:120px}
.journey-list{border-top:1px solid var(--line)}
.journey-row{display:grid;grid-template-columns:42px 1fr;gap:16px;padding:23px 0;border-bottom:1px solid var(--line)}
.journey-index{width:36px;height:36px;display:grid;place-items:center;border:1px solid #bfcdbd;color:var(--green);font-size:.78rem;font-weight:900}
.journey-row h3{margin-bottom:7px}
.journey-row p{font-size:.88rem;margin-bottom:0}
.faq-grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:55px;align-items:start}
.faq-list{border-top:1px solid var(--line)}
details{border-bottom:1px solid var(--line);padding:18px 0}
summary{cursor:pointer;list-style:none;font-weight:800;display:flex;justify-content:space-between;gap:15px;align-items:center}
summary::-webkit-details-marker{display:none}
summary:after{content:"+";font-size:1.35rem;font-weight:500;color:var(--green)}
details[open] summary:after{content:"−"}
details p{font-size:.9rem;margin:12px 30px 0 0}
.bottom-cta{background:var(--lime);padding:52px 0}
.cta-inner{display:flex;align-items:center;justify-content:space-between;gap:28px}
.cta-inner h2{font-size:clamp(1.8rem,3vw,2.7rem);margin-bottom:8px}
.cta-inner p{margin:0;color:#42533e}
footer{background:#0d2d1f;color:#fff;padding:33px 0;margin-top:30px}
footer .brand span:not(.mark){color:#fff}
footer .brand small{color:#c2d3c4}
footer .brand-logo{height:46px;width:55px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap}
.foot>div>p{color:#c3d4c6;font-size:.76rem;margin:7px 0 0}
.footlinks{display:flex;gap:16px;flex-wrap:wrap;font-size:.82rem;color:#dbe5dc}

/* Refined SIWES landing page */
:root{--forest:#123d2b;--green:#216b47;--lime:#d9ea83;--paper:#f6f7f2;--line:#dce4da}
html{scroll-behavior:smooth;scroll-padding-top:100px}
body{overflow-x:hidden}
.btn,.links a,.panel,.fieldwork-card,.icon-box{transition:transform .28s ease,box-shadow .28s ease,background-color .28s ease,color .28s ease}
.btn{border-radius:3px;min-height:46px}
.btn-light{background:var(--lime)!important;color:var(--forest)!important}
.outline-light{background:transparent!important;color:#fff!important;border:1px solid #ffffff80!important}
.hero{isolation:isolate;background:radial-gradient(circle at 10% 10%,#2c6648 0,transparent 36%),linear-gradient(125deg,#0d2c1e 0%,#123d2b 54%,#1c5237 100%);padding:clamp(54px,7vw,92px) 0}
.hero:before{width:580px;height:580px;right:-190px;top:-260px;border:1px solid #ffffff20;animation:orbitSlow 32s linear infinite}
.hero:after{width:420px;height:420px;right:-110px;bottom:-300px;border:1px solid #d9ea8333;animation:orbitSlow 25s linear infinite reverse}
.hero-grid{grid-template-columns:minmax(0,1.05fr) minmax(300px,.95fr);gap:clamp(28px,5vw,68px)}
.hero h1{max-width:700px;font-size:clamp(2.55rem,5.3vw,5rem)}
.hero .eyebrow{display:inline-flex;padding:9px 12px;border:1px solid #d9ea8340;border-radius:99px;background:#ffffff08}
.hero .eyebrow:before{width:7px;height:7px;border-radius:50%;box-shadow:0 0 0 4px #d9ea8322}
.hero-lede{max-width:590px}
.hero-actions .btn:hover{transform:translateY(-3px);box-shadow:0 12px 26px #06180e4d}
.hero-photo-scene{min-height:440px;isolation:isolate}
.hero-photo-main{position:absolute;inset:12px 22px 34px 20px;overflow:hidden;border-radius:6px 6px 64px 6px;box-shadow:0 30px 70px #06180e66;animation:photoFloat 7s ease-in-out infinite}
.hero-photo-main>img{width:100%;height:100%;min-height:380px;object-fit:cover;display:block;transform:scale(1.02);animation:photoZoom 18s ease-in-out infinite alternate}
.photo-shade{position:absolute;inset:0;background:linear-gradient(180deg,#071b1010 15%,#071b107a 100%)}
.photo-caption{position:absolute;bottom:25px;left:25px;right:22px;color:white;display:flex;flex-direction:column;gap:7px}
.photo-kicker{font-size:.67rem;letter-spacing:.16em;font-weight:900;color:var(--lime)}
.photo-caption strong{font-size:clamp(1.3rem,2.4vw,2rem);line-height:1.12;letter-spacing:-.035em;max-width:320px}

.float-tag-icon{display:grid;place-items:center;width:36px;height:36px;flex:0 0 36px;background:#123d2b16;border-radius:50%}

.trust-strip{position:relative;z-index:3;box-shadow:0 10px 35px #193d2110}
.trust-item{padding:22px 20px}

.section{padding:clamp(54px,7vw,88px) 0}
.head h2,.fieldwork-heading h2{max-width:690px}
.grid{gap:18px}
.panel{border-radius:5px;box-shadow:0 8px 24px #142d1a05}

.panel .num{display:inline-flex;padding:6px 9px;border-radius:3px;background:#edf4e8;margin-bottom:20px}

.requirements-card{border-radius:5px;box-shadow:0 18px 40px #102f2218}

.journey-grid{display:grid;grid-template-columns:.78fr 1.22fr;gap:clamp(30px,6vw,80px)}
.journey-intro{align-self:start;position:sticky;top:115px}
.journey-list{border-top:1px solid var(--line)}
.journey-row{display:grid;grid-template-columns:46px 1fr;gap:17px;padding:23px 0;border-bottom:1px solid var(--line)}
.journey-index{display:grid;place-items:center;width:42px;height:42px;background:#e9f0e5;color:var(--forest);font-weight:900;border-radius:50%}
.journey-row h3{margin:2px 0 9px}
.journey-row p{font-size:.9rem;margin:0}
.faq-grid{display:grid;grid-template-columns:.75fr 1.25fr;gap:55px}
.faq-list details{background:#fff;border:1px solid var(--line);border-radius:4px;padding:17px 19px;margin-bottom:10px}
.faq-list summary{font-weight:800;cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px}
.faq-list summary::-webkit-details-marker{display:none}
.faq-list summary:after{content:"+";font-size:1.3rem;color:var(--green);font-weight:500}
.faq-list details[open] summary:after{content:"−"}
.faq-list details p{margin:12px 0 0;font-size:.9rem}
.bottom-cta{padding:45px 0;background:var(--lime);color:var(--forest)}
.cta-inner{display:flex;align-items:center;justify-content:space-between;gap:25px}
.cta-inner h2{font-size:clamp(1.7rem,3vw,2.5rem);margin:0 0 9px}
.cta-inner p{color:#385542;margin:0}
.cta-inner .btn{background:var(--forest);color:white;flex-shrink:0}
.footer-bottom{border-top:1px solid #ffffff1b;margin-top:24px;padding-top:17px;color:#c0d0c4;font-size:.74rem}
.reveal-enabled .reveal-item{opacity:0;transform:translateY(22px);transition:opacity .65s ease,transform .65s cubic-bezier(.2,.7,.2,1);transition-delay:var(--reveal-delay,0ms)}
.reveal-enabled .reveal-item.is-visible{opacity:1;transform:translateY(0)}
@keyframes photoFloat{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-7px) rotate(.25deg)}}
@keyframes photoZoom{from{transform:scale(1.02)}to{transform:scale(1.1)}}
@keyframes insetBob{0%,100%{transform:rotate(4deg) translateY(0)}50%{transform:rotate(1deg) translateY(-8px)}}
@keyframes tagBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes orbitSlow{to{transform:rotate(395deg)}}

async function letter(){if(!user){loginNotice();return}layout('<section class="dashboard"><div class="shell"><div class="page-title no-print"><div><div class="eyebrow">Placement document</div><h1>Acceptance letter</h1><p>Available only after approval and formal issue by Agrolyst.</p></div><a class="btn outline" href="/dashboard/">← Dashboard</a></div><div id="ls" class="panel">Checking status…</div><article id="letter" class="letter hidden"><div style="display:flex;align-items:center;gap:16px;border-bottom:2px solid var(--f);padding-bottom:18px">'+logo()+'<span style="margin-left:auto;font-size:12px">Student Industrial Work Experience Scheme</span></div><p style="margin-top:22px"><strong>Reference:</strong> <span id="lr"></span> &nbsp; <strong>Issue number:</strong> <span id="ln"></span></p><h2>Acceptance Letter for Industrial Training</h2><div class="letter-body"><p id="dateissue"></p><p><strong id="lname"></strong><br><span id="school"></span></p><p>Dear <span id="dear"></span>,</p><p>We are pleased to confirm that Agrolyst Integrated Farms and Services has approved your application for student industrial training, subject to your institution’s SIWES requirements and any onboarding instructions from our team.</p><p><strong>Training details</strong><br>Course: <span id="course"></span><br>Training area: <span id="area"></span><br>Duration: <span id="duration"></span><br>Start date: <span id="start"></span><br>End date: <span id="end"></span></p><p>Submit this letter to your institution or SIWES coordinator for any required approval. Confirm your resumption date with Agrolyst before reporting. Bring any school documents required and follow the supervised training, orientation and logbook instructions provided.</p><p>This letter does not replace separate institutional authorisation your school may require.</p><p>Yours faithfully,</p><p style="margin-top:40px"><strong>For: Agrolyst Integrated Farms and Services</strong><br>SIWES / Student Training Office</p></div><div async function admin(){if(!user){loginNotice();return}if(!["admin","reviewer"].includes(user.app_metadata?.siwes_role)){layout('<section class="dashboard"><div class="shell panel"><div class="eyebrow">Restricted workspace</div><h1>Reviewer access required</h1><p>Use a trusted Supabase admin workflow to set app_metadata.siwes_role to reviewer or admin. Never set this role from browser code.</p><a class="btn outline" href="/dashboard/">Return to dashboard</a></div></section>');return}layout('<section class="dashboard"><div class="shell"><div class="page-title"><div><div class="eyebrow">Restricted workspace</div><h1>SIWES application review</h1><p>Review applications and record official decisions.</p></div><a class="btn outline" href="/dashboard/">Applicant dashboard</a></div><div id="am" class="message hidden"></div><div class="stats"><div class="stat">Applications<strong id="count">0</strong></div><div class="stat">Awaiting review<strong id="pending">0</strong></div><div class="stat">Letters issued<strong id="issued">0</strong></div></div><div class="table-wrap"><table><thead><tr><th>Applicant / school</th><th>Reference</th><th>Status</th><th>Actions</th></tr></thead><tbody id="rows"><tr><td colspan="4">Loading…</td></tr></tbody></table></div></div></section>');try{const{data,error}=await sb.from("siwes_applications").select("*").order("created_at",{ascending:false});if(error)throw error;adminRows=data||[];document.getElementById("count").textContent=adminRows.length;document.getElementById("pending").textContent=adminRows.filter(a=>["under_review","changes_requested","compliance_incomplete"].includes(a.status)).length;document.getElementById("issued").textContent=adminRows.filter(a=>a.status==="acceptance_letter_issued").length;const rows=document.getElementById("rows");rows.innerHTML=adminRows.length?adminRows.map(a=>'<tr><td><strong>'+esc(a.full_name||"Not completed")+'</strong><br>'+esc(a.institution||"School not provided")+'</td><td>'+esc(a.reference_no)+'</td><td>'+badge(a.status)+'</td><td><div class="admin-actions"><button class="outline" data-act="details" data-id="'+esc(a.id)+'">Details</button><button data-act="approve" data-id="'+esc(a.id)+'">Approve</button><button class="outline" data-act="issue" data-id="'+esc(a.id)+'">Issue letter</button><button class="outline" data-act="changes" data-id="'+esc(a.id)+'">Request changes</button><button class="outline" data-act="reject" data-id="'+esc(a.id)+'">Reject</button></div></td></tr>').join(""):'<tr><td colspan="4">No applications yet.</td></tr>';rows.onclick=async e=>{const b=e.target.closest("button[data-act]");if(!b)return;const a=adminRows.find(x=>x.id===b.dataset.id),act=b.dataset.act;if(!a)return;if(act==="details"){const{data:d,error:de}=await sb.from("siwes_documents").select("*").eq("application_id",a.id);const box=document.getElementById("adetail");if(!box){const div=document.createElement("div");div.id="adetail";div.className="panel";document.querySelector(".table-wrap").after(div)}const detail=document.getElementById("adetail");detail.innerHTML='<h2>Applicant details</h2>'+[["Name",a.full_name],["Phone",a.phone],["Institution",a.institution],["Department",a.department],["Course",a.course_of_study],["Level",a.study_level],["Area",a.training_area],["Duration",a.duration],["Dates",date(a.start_date)+" – "+date(a.end_date)],["Address",a.address],["Reviewer note",a.review_notes]].map(x=>'<p><strong>'+esc(x[0])+':</strong> '+esc(x[1]||"—")+'</p>').join("")+'<h3>Documents</h3>'+(de?esc(de.message):(d||[]).map(x=>'<p>'+esc(x.document_type)+' · '+esc(x.original_filename)+' <button class="outline" data-file="'+esc(x.storage_path)+'">Secure link</button></p>').join("")||"No documents uploaded.");detail.onclick=async ev=>{const f=ev.target.closest("button[data-file]");if(!f)return;const{data,error}=await sb.storage.from("siwes-private").createSignedUrl(f.dataset.file,120);if(error)msg("am",error.message,true);else window.open(data.signedUrl,"_blank","noopener")};return}let note="";if(["approve","changes","reject"].includes(act)){note=prompt("Reviewer note"+(act==="changes"?" (required)":" (optional)")+":",act==="changes"?"Please correct the submitted information or documents.":"");if(note===null)return;if(act==="changes"&&!note.trim())return}if(act==="issue"&&!confirm("Formally issue the acceptance letter for "+(a.full_name||a.reference_no)+"?"))return;const patch={reviewer_id:user.id,reviewed_at:new Date().toISOString(),review_notes:note||null};if(act==="approve")patch.status="approved";if(act==="changes")patch.status="changes_requested";if(act==="reject")patch.status="rejected";if(act==="issue"){patch.status="acceptance_letter_issued";patch.acceptance_letter_number=a.acceptance_letter_number||"AG-SIWES-"+Date.now().toString(36).toUpperCase();patch.acceptance_letter_issued_at=new Date().toISOString();patch.review_notes="Acceptance letter formally issued."}b.disabled=true;const{error:up}=await sb.from("siwes_applications").update(patch).eq("id",a.id);b.disabled=false;if(up){msg("am",up.message,true);return}msg("am","Updated: "+states[patch.status]);await admin()}}catch(e){msg("am",e.message,true)}}

function legalPage(kind){const isPrivacy=kind==="privacy";const title=isPrivacy?"Privacy Notice":"Participation Agreement";const intro=isPrivacy?"How Agrolyst handles information submitted through the SIWES applicant portal.":"Terms for using the Agrolyst SIWES applicant portal.";const sections=isPrivacy?`
<h2>1. Information we collect</h2><p>Depending on the features you use, we may collect your name, email address, contact details, institution and course information, SIWES placement details, application documents, correspondence, and basic technical or account information needed to operate and secure the portal. If you use Google sign-in, the authentication service shares account information required to sign you in.</p>
<h2>2. How we use information</h2><p>We use information to create and maintain accounts, process and review SIWES applications, communicate with applicants, manage placement records, provide support, protect the service, and meet relevant administrative or legal obligations.</p>
<h2>3. Sharing</h2><p>We do not sell personal information. Where necessary, relevant information may be accessed by authorised Agrolyst personnel, appropriate school or placement contacts, and service providers supporting hosting, authentication, security or portal operations. Information may also be disclosed where required by law.</p>
<h2>4. Storage and security</h2><p>We use reasonable technical and organisational safeguards to protect information. No online system can be guaranteed completely secure. Keep your password private and tell the programme contact if you suspect unauthorised access.</p>
<h2>5. Retention</h2><p>Information is retained for as long as reasonably needed to administer applications and placements, maintain necessary records, resolve disputes, and meet legal or administrative requirements.</p>
<h2>6. Your choices</h2><p>Subject to applicable law, you may ask to access or correct your information, request deletion, or ask questions about its use. Some records may need to be retained for legitimate administrative or legal reasons. We may verify your identity before responding.</p>
<h2>7. Cookies and account features</h2><p>The portal or its authentication provider may use essential browser storage to maintain sign-in sessions and support security. Disabling these features may prevent sign-in or other functions from working.</p>
<h2>8. Updates and contact</h2><p>We may update this notice as the portal and its processes change. For privacy questions or requests, use the official contact channel provided by the SIWES programme or the <a href="/">portal home page</a>. Do not send your password or authentication secrets.</p>`:`
<h2>1. Purpose</h2><p>The portal supports SIWES application and placement administration, including account access, application submissions, documents and programme communications. Creating an account does not guarantee acceptance, placement, employment, a stipend or a completion certificate.</p>
<h2>2. Accurate information</h2><p>You agree to submit information that is accurate, current and complete to the best of your knowledge. You are responsible for correcting mistakes and ensuring documents are genuine and lawfully shared. False or altered documents may result in further review or application rejection.</p>
<h2>3. Account security</h2><ul><li>Keep your login credentials private.</li><li>Use an email address you control and complete any required verification.</li><li>Notify the programme contact if you suspect account misuse.</li><li>Do not knowingly allow unauthorised people to use your account.</li></ul>
<h2>4. Appropriate use</h2><p>You must not impersonate another person, submit fraudulent material, attempt unauthorised access, interfere with portal security, upload malicious code, harvest other applicants’ information, or use the portal for unlawful or disruptive purposes.</p>
<h2>5. Applications and decisions</h2><p>Agrolyst may review applications for completeness and suitability and may request further information. Outcomes and timelines depend on programme requirements and placement capacity. Any placement is subject to the specific written communication and requirements issued for it.</p>
<h2>6. Privacy and documents</h2><p>Information submitted through the portal is handled as described in the <a href="/privacy">Privacy Notice</a>. Submit only relevant information and keep copies of important documents.</p>
<h2>7. Availability and access</h2><p>We aim to keep the portal available but cannot guarantee uninterrupted or error-free service. We may change, suspend or restrict features when reasonably necessary for maintenance, security or programme administration.</p>
<h2>8. Suspension</h2><p>Access may be restricted where we reasonably believe there is a security risk, a breach of these terms, materially misleading information, or a legal or administrative reason to do so.</p>
<h2>9. Updates and applicable law</h2><p>We may revise these terms as portal features or programme requirements change. This agreement is intended to operate subject to applicable laws of the Federal Republic of Nigeria; rights that cannot lawfully be excluded remain unaffected.</p>
<h2>10. Questions</h2><p>For questions about these terms or your application, use the official contact channel provided by the SIWES programme or visit the <a href="/">portal home page</a>.</p>`;
